[project]
name = "delaymodel"
version = "0.1.0"
description = "Delayed-report accumulator model: parameter-space evaluation against EMG partial-activation and behavioural data (J Neuroscience R1)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
]
